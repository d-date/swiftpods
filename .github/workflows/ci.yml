name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Unit and integration tests
        run: swift test
      - name: Build generated workspaces with xcodebuild
        run: swift test --filter integratedWorkspaceBuilds
        env:
          SWIFTPODS_XCODEBUILD: "1"
